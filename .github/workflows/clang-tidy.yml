# Static analysis over every hand-written TU (vendored qcustomplot excluded),
# via the same scripts/run-tidy.sh developers run locally. Needs a full build
# first so the AUTOMOC/AUTOUIC generated headers exist for the Qt TUs.
# LLVM 20 from apt.llvm.org for both the build (libstdc++ hides std::expected
# from clang < 19) and the analysis (ExcludeHeaderFilterRegex needs
# clang-tidy >= 19); ubuntu-latest ships 18.
name: clang-tidy

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.2
        target: desktop

    # The PATH prepend makes the preset's bare clang/clang++ resolve to 20 for
    # the build step below.
    - name: Install LLVM 20
      run: |
        wget -q https://apt.llvm.org/llvm.sh
        sudo bash llvm.sh 20
        sudo apt-get install -y clang-tidy-20
        echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ubuntu-latest-clang-tidy

    - name: Configure and build
      run: >
        cmake --preset debug-clang
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        && cmake --build --preset debug-clang

    - name: Run clang-tidy
      run: CLANG_TIDY=clang-tidy-20 RUN_CLANG_TIDY=run-clang-tidy-20 scripts/run-tidy.sh
