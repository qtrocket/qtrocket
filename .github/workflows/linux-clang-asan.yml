# One workflow per CI configuration so each gets its own README status badge.
# Shared steps live in .github/actions/build-and-test. The asan-clang preset
# builds with ASan+UBSan (FetchContent deps instrumented too) and runs the
# tests instrumented.
name: Linux Clang ASan+UBSan

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    name: Linux / Clang ASan+UBSan
    runs-on: ubuntu-latest
    env:
      # UBSan findings are already fatal (-fno-sanitize-recover), this just makes
      # the CI log actionable when one fires.
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
    - uses: actions/checkout@v4
    # ubuntu-latest's newest clang (18) predates __cpp_concepts=202002, so
    # libstdc++ hides std::expected from it; clang >= 19 is required. The PATH
    # prepend makes the preset's bare clang/clang++ resolve to 20.
    - name: Install LLVM 20
      run: |
        wget -q https://apt.llvm.org/llvm.sh
        sudo bash llvm.sh 20
        echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"
    - uses: ./.github/actions/build-and-test
      with:
        preset: asan-clang
        cache-key: ubuntu-latest-asan-clang
