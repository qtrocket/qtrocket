# One workflow per CI configuration so each gets its own README status badge.
# Shared steps live in .github/actions/build-and-test.
name: Linux Clang

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    name: Linux / Clang
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # ubuntu-latest's newest clang (18) predates __cpp_concepts=202002, so
    # libstdc++ hides std::expected from it; clang >= 19 is required. The PATH
    # prepend makes the preset's bare clang/clang++ resolve to 20.
    - name: Install LLVM 20
      run: |
        wget -q https://apt.llvm.org/llvm.sh
        sudo bash llvm.sh 20
        echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"
    - uses: ./.github/actions/build-and-test
      with:
        preset: release-clang
        cache-key: ubuntu-latest-release-clang
