# Multi-platform CI for QtRocket.
#
# CI drives the build through the project's CMake presets (CMakePresets.json), so
# it exercises the same Ninja-based configure/build/test path that developers use
# locally instead of each platform's default generator. Each matrix entry maps an
# OS to a preset:
#   - Linux:   release-gcc, release-clang
#   - macOS:   release-clang (AppleClang)
#   - Windows: release-msvc  (added to CMakePresets.json; Ninja + cl)
name: CMake on multiple platforms

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Keep running every configuration even if one fails, so a single
      # platform/compiler breakage doesn't mask the others.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  preset: release-gcc,   name: "Linux / GCC" }
          - { os: ubuntu-latest,  preset: release-clang, name: "Linux / Clang" }
          - { os: macos-latest,   preset: release-clang, name: "macOS / AppleClang" }
          - { os: windows-latest, preset: release-msvc,  name: "Windows / MSVC" }

    steps:
    - uses: actions/checkout@v4

    # Provides a recent CMake plus Ninja on every runner. Ninja is not installed
    # by default on the Linux/macOS images, and all presets require it.
    - name: Install CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.2
        target: desktop

    # The Ninja generator + cl need the MSVC toolchain environment (vcvars).
    # The VS generator set this up implicitly; with Ninja we do it explicitly.
    - name: Set up MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    # Cache compiled objects (including the FetchContent dependencies: curl,
    # Boost, Eigen, GoogleTest, jsoncpp) across runs to cut build times.
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ matrix.os }}-${{ matrix.preset }}

    - name: Configure
      run: >
        cmake --preset ${{ matrix.preset }}
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }}

    - name: Test
      # The presets use single-config Ninja, so no --build-config is needed.
      # The qtrocket_* filter runs each suite once via its aggregate ctest entry
      # (model, sim, integration, propagator).
      run: ctest --preset ${{ matrix.preset }} -R 'qtrocket_*'
