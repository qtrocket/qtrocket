# Multi-platform CI for QtRocket.
#
# CI drives the build through the project's CMake presets (CMakePresets.json), so
# it exercises the same Ninja-based configure/build/test path that developers use
# locally instead of each platform's default generator. Each matrix entry maps an
# OS to a preset:
#   - Linux:   release-gcc, release-clang, asan-clang (ASan+UBSan, tests run instrumented)
#   - macOS:   release-clang (AppleClang)
#   - Windows: release-msvc  (added to CMakePresets.json; Ninja + cl)
# A separate clang-tidy job runs scripts/run-tidy.sh (the same entry point
# developers use locally) over every hand-written TU with findings as errors.
name: CMake on multiple platforms

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Keep running every configuration even if one fails, so a single
      # platform/compiler breakage doesn't mask the others.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  preset: release-gcc,   name: "Linux / GCC" }
          - { os: ubuntu-latest,  preset: release-clang, name: "Linux / Clang" }
          - { os: ubuntu-latest,  preset: asan-clang,    name: "Linux / Clang ASan+UBSan" }
          - { os: macos-latest,   preset: release-clang, name: "macOS / AppleClang" }
          - { os: windows-latest, preset: release-msvc,  name: "Windows / MSVC" }

    env:
      # Only consumed by the sanitizer preset's test run; harmless elsewhere.
      # UBSan findings are already fatal (-fno-sanitize-recover), this just makes
      # the CI log actionable when one fires.
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
    - uses: actions/checkout@v4

    # Provides a recent CMake plus Ninja on every runner. Ninja is not installed
    # by default on the Linux/macOS images, and all presets require it.
    - name: Install CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.2
        target: desktop

    # The Ninja generator + cl need the MSVC toolchain environment (vcvars).
    # The VS generator set this up implicitly; with Ninja we do it explicitly.
    - name: Set up MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    # Cache compiled objects (including the FetchContent dependencies: curl,
    # Boost, Eigen, GoogleTest, jsoncpp) across runs to cut build times.
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ matrix.os }}-${{ matrix.preset }}

    - name: Configure
      run: >
        cmake --preset ${{ matrix.preset }}
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }}

    - name: Test
      # The presets use single-config Ninja, so no --build-config is needed.
      # The qtrocket_* filter runs each suite once via its aggregate ctest entry
      # (model, sim, integration, propagator).
      run: ctest --preset ${{ matrix.preset }} -R 'qtrocket_*'

  # FreeBSD has no hosted GitHub runner, so we boot a FreeBSD VM (QEMU) inside an
  # ubuntu-latest runner via vmactions/freebsd-vm and build there. It's separate
  # from the matrix above because the toolchain setup differs: Qt comes from pkg
  # (install-qt-action ships no FreeBSD binaries) and the base compiler is Clang
  # with libc++. Reuses the release-clang preset as-is.
  freebsd:
    name: FreeBSD / Clang
    runs-on: ubuntu-latest
    # No ccache here yet and the FetchContent deps build from source in the VM,
    # so the first run is slow; the generous timeout keeps a stalled VM from
    # running forever.
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4

    - name: Build and test on FreeBSD
      uses: vmactions/freebsd-vm@v1
      with:
        release: "15.0"        # adjust to the FreeBSD you run; pkg uses the quarterly branch
        usesh: true
        copyback: false        # we only need the test exit status, not the build tree synced back
        # Qt6 + build tooling from pkg. Everything else (curl, Boost, Eigen,
        # GoogleTest, jsoncpp) is FetchContent and builds from source in the VM,
        # so git is required. The hermetic curl config means OpenSSL + zlib (both
        # in the FreeBSD base system) are the only external libs curl needs.
        prepare: |
          pkg install -y cmake ninja git pkgconf qt6-base qt6-tools
        run: |
          set -e
          cmake --preset release-clang
          cmake --build --preset release-clang
          ctest --preset release-clang -R 'qtrocket_*'

  # Static analysis over every hand-written TU (vendored qcustomplot excluded),
  # via the same scripts/run-tidy.sh developers run locally. Needs a full build
  # first so the AUTOMOC/AUTOUIC generated headers exist for the Qt TUs.
  # clang-tidy 20 from apt.llvm.org: the .clang-tidy config uses
  # ExcludeHeaderFilterRegex, which needs clang-tidy >= 19; ubuntu-latest ships 18.
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.2
        target: desktop

    - name: Install clang-tidy 20
      run: |
        wget -q https://apt.llvm.org/llvm.sh
        sudo bash llvm.sh 20
        sudo apt-get install -y clang-tidy-20

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ubuntu-latest-clang-tidy

    - name: Configure and build
      run: >
        cmake --preset debug-clang
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        && cmake --build --preset debug-clang

    - name: Run clang-tidy
      run: CLANG_TIDY=clang-tidy-20 RUN_CLANG_TIDY=run-clang-tidy-20 scripts/run-tidy.sh
